# Family apps stack: Wombat + Kooka + Wallaby + Pelican (Portainer → Stacks → Add stack → Web editor, or
# `docker compose --env-file stack.env up -d`). Pocket ID is NOT here: use the one you already have.
#
# Before deploying:
#   1. build the images on the Docker host:  ./build-images.sh   (they are local images, never pulled)
#   2. fill in the variables (Portainer: "Environment variables" → "Load variables from .env file" with
#      stack.env.example filled in)
#   3. your reverse proxy (HTTPS) forwards each public address to the port published below
#
# Data lives in folders of the host under DATA_ROOT, so backups (Pelican's Borg script, copies of the folders)
# work from the host. The apps talk to Wombat over the internal network "family".

x-common: &common
  restart: unless-stopped
  networks: [family]

services:
  wombat:
    <<: *common
    image: wombat:latest
    container_name: wombat
    ports: ["${WOMBAT_PORT:-3004}:3004"]
    volumes: ["${DATA_ROOT:?set DATA_ROOT}/wombat:/app/data"]
    environment:
      PORT_CHECK: "3004"
      TZ: ${TZ:-Europe/Rome}
      WOMBAT_URL: ${WOMBAT_URL:?set WOMBAT_URL}
      WOMBAT_COOKIE_SECURE: "1"
      WOMBAT_PROXY: "1"
      WOMBAT_SIGNUP: closed
      WOMBAT_PASSWORD_LOGIN: "0"
      WOMBAT_OIDC: pocketid
      WOMBAT_OIDC_POCKETID_ISSUER: ${POCKETID_ISSUER:?set POCKETID_ISSUER}
      WOMBAT_OIDC_POCKETID_ID: ${WOMBAT_OIDC_ID}
      WOMBAT_OIDC_POCKETID_SECRET: ${WOMBAT_OIDC_SECRET}
      WOMBAT_OIDC_POCKETID_NAME: Pocket ID
      WOMBAT_APPS: kooka,wallaby,pelican,quokka
      WOMBAT_APP_KOOKA_URL: ${KOOKA_URL}
      WOMBAT_APP_KOOKA_INTERNAL_URL: http://kooka:3001
      WOMBAT_APP_KOOKA_KEY: ${KOOKA_HUB_KEY:?set KOOKA_HUB_KEY}
      WOMBAT_APP_WALLABY_URL: ${WALLABY_URL}
      WOMBAT_APP_WALLABY_INTERNAL_URL: http://wallaby:3000
      WOMBAT_APP_WALLABY_KEY: ${WALLABY_HUB_KEY:?set WALLABY_HUB_KEY}
      WOMBAT_APP_PELICAN_URL: ${PELICAN_URL}
      WOMBAT_APP_PELICAN_INTERNAL_URL: http://pelican:3002
      WOMBAT_APP_PELICAN_KEY: ${PELICAN_HUB_KEY:?set PELICAN_HUB_KEY}
      # Quokka (its own stack): only asks, through Wombat; the same key as QUOKKA_HUB_KEY there
      WOMBAT_APP_QUOKKA_URL: ${QUOKKA_URL:-}
      WOMBAT_APP_QUOKKA_KEY: ${QUOKKA_HUB_KEY:-}
      WOMBAT_SMTP_HOST: ${SMTP_HOST:-}
      WOMBAT_SMTP_PORT: ${SMTP_PORT:-587}
      WOMBAT_SMTP_USER: ${SMTP_USER:-}
      WOMBAT_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WOMBAT_MAIL_FROM: Wombat <${MAIL_FROM_ADDRESS:-noreply@example.com}>
    healthcheck: &health
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/me' % os.environ.get('PORT_CHECK'), timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  kooka:
    <<: *common
    image: kooka:latest
    container_name: kooka
    ports: ["${KOOKA_PORT:-3001}:3001"]
    volumes: ["${DATA_ROOT}/kooka:/app/data"]
    environment:
      PORT_CHECK: "3001"
      TZ: ${TZ:-Europe/Rome}
      KOOKA_URL: ${KOOKA_URL:?set KOOKA_URL}
      KOOKA_COOKIE_SECURE: "1"
      KOOKA_PROXY: "1"
      KOOKA_SIGNUP: closed
      KOOKA_REMINDER_HOUR: ${KOOKA_REMINDER_HOUR:-8}
      KOOKA_OIDC: pocketid
      KOOKA_OIDC_POCKETID_ISSUER: ${POCKETID_ISSUER}
      KOOKA_OIDC_POCKETID_ID: ${KOOKA_OIDC_ID}
      KOOKA_OIDC_POCKETID_SECRET: ${KOOKA_OIDC_SECRET}
      KOOKA_OIDC_POCKETID_NAME: Pocket ID
      KOOKA_HUB_URL: http://wombat:3004
      KOOKA_HUB_PUBLIC_URL: ${WOMBAT_URL}
      KOOKA_HUB_KEY: ${KOOKA_HUB_KEY}
      KOOKA_SMTP_HOST: ${SMTP_HOST:-}
      KOOKA_SMTP_PORT: ${SMTP_PORT:-587}
      KOOKA_SMTP_USER: ${SMTP_USER:-}
      KOOKA_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KOOKA_MAIL_FROM: Kooka <${MAIL_FROM_ADDRESS:-noreply@example.com}>
    healthcheck: *health

  wallaby:
    <<: *common
    image: wallaby:latest
    container_name: wallaby
    ports: ["${WALLABY_PORT:-3000}:3000"]
    volumes: ["${DATA_ROOT}/wallaby:/app/data"]
    environment:
      PORT_CHECK: "3000"
      TZ: ${TZ:-Europe/Rome}
      WALLABY_URL: ${WALLABY_URL:?set WALLABY_URL}
      WALLABY_COOKIE_SECURE: "1"
      WALLABY_PROXY: "1"
      WALLABY_SIGNUP: closed
      WALLABY_OIDC: pocketid
      WALLABY_OIDC_POCKETID_ISSUER: ${POCKETID_ISSUER}
      WALLABY_OIDC_POCKETID_ID: ${WALLABY_OIDC_ID}
      WALLABY_OIDC_POCKETID_SECRET: ${WALLABY_OIDC_SECRET}
      WALLABY_OIDC_POCKETID_NAME: Pocket ID
      WALLABY_HUB_URL: http://wombat:3004
      WALLABY_HUB_PUBLIC_URL: ${WOMBAT_URL}
      WALLABY_HUB_KEY: ${WALLABY_HUB_KEY}
      WALLABY_SMTP_HOST: ${SMTP_HOST:-}
      WALLABY_SMTP_PORT: ${SMTP_PORT:-587}
      WALLABY_SMTP_USER: ${SMTP_USER:-}
      WALLABY_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WALLABY_MAIL_FROM: Wallaby <${MAIL_FROM_ADDRESS:-noreply@example.com}>
    healthcheck: *health

  pelican:
    <<: *common
    image: pelican:latest
    container_name: pelican
    ports: ["${PELICAN_PORT:-3002}:3002"]
    volumes: ["${DATA_ROOT}/pelican:/app/data"]
    environment:
      PORT_CHECK: "3002"
      TZ: ${TZ:-Europe/Rome}
      PELICAN_URL: ${PELICAN_URL:?set PELICAN_URL}
      PELICAN_COOKIE_SECURE: "1"
      PELICAN_PROXY: "1"
      PELICAN_SIGNUP: closed
      PELICAN_OIDC: pocketid
      PELICAN_OIDC_POCKETID_ISSUER: ${POCKETID_ISSUER}
      PELICAN_OIDC_POCKETID_ID: ${PELICAN_OIDC_ID}
      PELICAN_OIDC_POCKETID_SECRET: ${PELICAN_OIDC_SECRET}
      PELICAN_OIDC_POCKETID_NAME: Pocket ID
      PELICAN_HUB_URL: http://wombat:3004
      PELICAN_HUB_PUBLIC_URL: ${WOMBAT_URL}
      PELICAN_HUB_KEY: ${PELICAN_HUB_KEY}
      PELICAN_SMTP_HOST: ${SMTP_HOST:-}
      PELICAN_SMTP_PORT: ${SMTP_PORT:-587}
      PELICAN_SMTP_USER: ${SMTP_USER:-}
      PELICAN_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PELICAN_MAIL_FROM: Pelican <${MAIL_FROM_ADDRESS:-noreply@example.com}>
      # Import by email (leave empty to turn it off)
      PELICAN_INBOX_ADDRESS: ${PELICAN_INBOX_ADDRESS:-}
      PELICAN_IMAP_HOST: ${PELICAN_IMAP_HOST:-}
      PELICAN_IMAP_PORT: ${PELICAN_IMAP_PORT:-993}
      PELICAN_IMAP_USER: ${PELICAN_IMAP_USER:-}
      PELICAN_IMAP_PASSWORD: ${PELICAN_IMAP_PASSWORD:-}
      PELICAN_IMAP_DONE_FOLDER: ${PELICAN_IMAP_DONE_FOLDER:-}
    healthcheck: *health

networks:
  family:
    name: family
